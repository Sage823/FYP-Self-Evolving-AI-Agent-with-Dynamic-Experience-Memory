[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-memory-agent"
version = "0.1.0"
description = "A small, reproducible experience-memory loop for a self-evolving LLM agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "scipy>=1.11",
  "chromadb>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
semantic = [
  "sentence-transformers>=3,<5",
  "transformers>=4.41,<5",
]

[project.scripts]
experience-agent = "experience_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

